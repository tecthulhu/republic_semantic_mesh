# The build gate (PA-004): one gate library mounted at CI.
#
# SPEC-0073 — CTRL-0004 runs on every change and a red suite blocks merge
# (ENF-0001, RULE-0076..0078). Nothing here is advisory: every step that can
# fail does fail the job, and the evidence rows produced are uploaded so a
# reader can check the claim rather than trust the badge.
#
# Branch protection is the other half of this gate and lives in repository
# settings, not here: "a red suite blocks merge" is only true once this check is
# required on main. That is an owner action.

name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
# `administration: read` is NOT available here. It is a valid PAT scope but not a
# GITHUB_TOKEN workflow permission, and naming it fails workflow validation before any
# job is created — which reports as the required contexts never arriving, not as a red
# check, so the merge gate silently stops existing. It did exactly that once.
#
# Consequence for CTRL-0009: the Actions token cannot read `bypass_actors`, so the CI
# capture records that fact as unobserved rather than assuming it. The authenticated
# capture is an operator run committed to the Acta. See SPEC-0130.

jobs:
  corpus:
    # Context name is stable and short on purpose: renaming a job after it is a
    # required check silently breaks the requirement — the old context never reports
    # again, so the rule matches nothing. The controls it runs are listed in steps.
    name: corpus-controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SPEC-0113 compares against the merge base, so the default shallow
          # clone is not enough history to compare with.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tool dependencies
        working-directory: platform
        run: python -m pip install -r tools/requirements.txt
      # --tree is SPEC-0121: every *.md is governed, allowlisted, or a violation.
      - name: CTRL-0001 — atom-lint over the whole tree
        working-directory: platform
        # No path argument: the corpus default plus --tree covers every governed
        # atom and the whole repository's shape, without a cwd-relative `..`.
        run: python tools/atom_lint.py --tree
      - name: atom-lint fixture suite (SPEC-0092/0095/0096)
        working-directory: platform
        run: python tools/test_atom_lint.py
      # SPEC-0108: the algebra is singular. Static check first — if a second
      # implementation has appeared, the property suite's pass means less than it
      # looks like, so the structural claim is gated ahead of the behavioural one.
      - name: SPEC-0108 — one-algebra static check
        working-directory: platform
        run: python tools/test_one_algebra.py
      - name: CTRL-0002 — grammar property suite (against the citizen algebra)
        working-directory: platform
        run: python tools/test_grammar.py
      - name: CTRL-0007 — embedder pipeline suite
        working-directory: platform
        run: python tools/test_embedder.py

      # SPEC-0111/0113/0114: the ceremony tool, instance immutability, and path
      # resolution. Fixture suites, so they run everywhere the corpus controls do.
      - name: SPEC-0111 — ceremony tool suite
        working-directory: platform
        run: python tools/test_enact.py
      - name: SPEC-0113 — instance immutability suite
        working-directory: platform
        run: python tools/test_immutability.py
      - name: SPEC-0114 — path resolution suite
        working-directory: platform
        run: python tools/test_paths.py
      - name: SPEC-0119/0121 — provenance and tree-shape suite
        working-directory: platform
        run: python tools/test_provenance.py

      # SPEC-0136: topology hygiene. Blocking — the class this closes reached the
      # public repo once already, and a check that only warns would let it back.
      - name: SPEC-0136 — topology-hygiene control and fixtures
        working-directory: platform
        run: |
          python tools/test_topology_lint.py
          python tools/topology_lint.py --no-evidence

      # SPEC-0116/0117: the human-evidence primitive. No automated path to a human
      # verdict, and content-addressed staleness.
      - name: SPEC-0116/0117 — human-evidence fixtures
        working-directory: platform
        run: python tools/test_human_evidence.py

      # SPEC-0086: the CLI pin, checked at last. Declaration against measurement for
      # the version; measurement against measurement for the binary.
      - name: SPEC-0086 — CLI pin check and fixtures
        working-directory: platform
        run: |
          python tools/test_cli_pin.py
          python tools/cli_pin_check.py --no-evidence

      # SPEC-0127: the pending-floor-touch flag over in-flight criteria.
      - name: SPEC-0127 — acceptance-edit lint fixtures
        working-directory: platform
        run: python tools/test_acceptance_edit.py

      # SPEC-0129/0126: the Class III attack, run and refused. Needs no container
      # and no network — the two-way disagreement between the pinned and the weakened
      # grade is pure logic, and it is the assertion the whole story rests on.
      - name: SPEC-0129/0126 — acceptance-baseline fixture suite
        working-directory: platform
        run: python harness/test_baseline.py

      # SPEC-0131/0133: the ingest lint's fixtures. The live tree lives outside this
      # repository so CI cannot check it — but the lint's *judgement* is code in here,
      # and code in here is gated. This is the enforceable half; the other half is
      # invoked, and SPEC-0131 says so on every row it writes.
      - name: SPEC-0131/0133 — ingest lint fixture suite
        working-directory: platform
        run: python tools/test_ingest_lint.py

      # SPEC-0130: the enforcement half of "a red suite blocks merge". Fixtures first —
      # they need no network, so a probe that cannot fail is caught before its live
      # verdict is believed.
      - name: SPEC-0130 — merge-enforcement fixture suite
        working-directory: platform
        run: python suite/enforcement/test_probe.py

      # Runs anonymously on purpose: the rules endpoint needs no credential, which is
      # what makes this reproducible by any reader. The bypass scope is out of reach
      # here and is recorded as unobserved.
      - name: CTRL-0009 — capture the live merge-enforcement state
        working-directory: platform
        run: python suite/enforcement/run.py --evidence-dir acta

      # SPEC-0113 applied to this change: no atom may have been edited in place
      # relative to the base branch. ONT-012/015 enforced rather than reviewed.
      - name: Instance immutability against the base branch
        if: github.event_name == 'pull_request'
        working-directory: platform
        run: python tools/atom_lint.py .. --since origin/${{ github.base_ref }}

  citizenship:
    name: citizenship-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suites mint on the host now (ENT-003: no credential factory inside a
      # citizen image), so this job needs the pinned crypto dependencies too.
      - name: Install pinned tool dependencies
        working-directory: platform
        run: python -m pip install -r tools/requirements.txt

      - name: Build the L0 gold base
        working-directory: platform
        run: docker build -f base/Dockerfile -t l0-base:BASE-v1 .

      - name: Build the hello-citizen fixture
        working-directory: platform
        run: |
          docker build -f base/fixtures/hello-citizen/Dockerfile \
            --build-arg BASE=l0-base:BASE-v1 -t l0-hello:dev .

      - name: Build the violating fixture
        working-directory: platform
        run: |
          docker build -f base/fixtures/violating/Dockerfile \
            --build-arg BASE=l0-base:BASE-v1 -t l0-violating:dev .

      # SPEC-0071: the conforming fixture must pass every in-scope criterion.
      - name: CTRL-0004 against hello-citizen (must pass)
        working-directory: platform
        run: python suite/citizenship/run.py --image l0-hello:dev --evidence-dir acta

      # SPEC-0072 v1.1.0: the sealing claims must be falsifiable. A suite that
      # cannot fail is decoration, so this step fails the job if the violating
      # fixture passes.
      - name: CTRL-0004 against the violating fixture (must fail the suite)
        working-directory: platform
        run: |
          python suite/citizenship/run.py --image l0-violating:dev \
            --expect-fail --evidence-dir acta/violating

      # The artifact is a convenience, never the record (D17): artifacts expire,
      # and a record with a countdown timer is not provenance. The rows that count
      # are the ones committed under platform/acta/ by the story branch.
      - name: Upload EVID- rows (convenience copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-0004-evidence
          path: platform/acta/**/EVID-*.json
          if-no-files-found: error

      # A CI run that produced rows the author never committed would leave the
      # record incomplete while reporting green. Surface the drift rather than
      # letting the gate imply the record is whole.
      - name: Report evidence rows not present in the commit
        if: always()
        working-directory: platform
        run: |
          git status --porcelain acta/ | tee /tmp/acta-drift
          if [ -s /tmp/acta-drift ]; then
            echo "::notice::CI emitted evidence rows absent from this commit; commit platform/acta/ on the story branch"
          fi
